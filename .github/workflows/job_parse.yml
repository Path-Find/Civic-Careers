name: Job Feed Parse

on:
  # schedule trigger paused while the parser/prompt is being actively tuned —
  # an automatic run would parse under a version about to be replaced anyway.
  # Re-enable once PARSER_VERSION has stabilized:
  # schedule:
  #   - cron: '30 10 * * 1,4' # Run Mon and Thu at 6:30 AM EDT (10:30 AM UTC) — off-peak for DeepSeek pricing, and after the 3 AM scrape has had time to finish
  workflow_dispatch: # Allow manual runs

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Run Parser
        env:
          NEON_CURRENT_DATABASE_URL: ${{ secrets.NEON_CURRENT_DATABASE_URL }}
          NEON_ARCHIVE_DATABASE_URL: ${{ secrets.NEON_ARCHIVE_DATABASE_URL }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: "deepseek-chat"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: cd scraper && npx tsx parser.ts
