name: Job Feed Parse (Paused)

on:
  # Deliberately manual-only while jobs are being parsed in Codex.
  # parser.ts exits before opening the database unless ENABLE_DEEPSEEK_PARSER=true.
  # schedule:
  #   - cron: '30 10 * * 1,4' # Run Mon and Thu at 6:30 AM EDT (10:30 AM UTC) — off-peak for DeepSeek pricing, and after the 3 AM scrape has had time to finish
  workflow_dispatch: # Allow manual runs

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Run Parser
        env:
          ENABLE_DEEPSEEK_PARSER: "false"
        run: cd scraper && npx tsx parser.ts
