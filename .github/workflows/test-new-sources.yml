name: Trial Source Scrape

on:
  schedule:
    - cron: '0 7 * * 1,4' # Match the regular scrape: Monday and Thursday at 3:00 AM EDT

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Check trial source references
        run: |
          cd scraper
          # The scraper has existing project-wide TypeScript diagnostics, so
          # fail only on undefined names in this trial entrypoint. This catches
          # a missing engine import before Playwright and the full scrape start.
          if npx tsc --noEmit --ignoreConfig --pretty false --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck test-new-sources.ts 2>&1 | grep -Eq 'test-new-sources\.ts\([0-9]+,[0-9]+\): error TS2304'; then
            echo 'Trial source entrypoint contains an undefined name.'
            exit 1
          fi

      - name: Install Playwright Browsers
        run: cd scraper && npx playwright install chromium --with-deps

      - name: Run Scraper (new sources only)
        env:
          # Scheduled trials intentionally persist their pass counts and raw
          # captures in the trial database. Local runs remain isolated unless
          # TRIAL_DB_URL is explicitly supplied.
          TRIAL_DB_URL: ${{ secrets.TURSO_URL }}
          ALLOW_LIVE_TRIAL_DB: "1"
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: cd scraper && npx tsx test-new-sources.ts
