name: Job Feed Scrape

on:
  schedule:
    - cron: '30 10 * * 1,4' # Run Mon and Thu at 6:30 AM EDT (10:30 AM UTC) — off-peak for DeepSeek pricing
  workflow_dispatch: # Allow manual runs, scoped to one engine or all of them
    inputs:
      engine:
        description: 'Engine to scrape (all = every engine, the full production run)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - successfactors
          - workday
          - njoyn
          - oracle
          - dayforce
          - jobs2web
          - icims
          - hrsmart
          - ultipro
          - adp
          - taleo
          - avanti
          - bamboohr
          - talentpoolbuilder
          - custom
          - rss
          - jazzhr
          - workland
          - jibe
      run_parse:
        description: 'Run the parser after scraping finishes'
        required: false
        default: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.set.outputs.engines }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.engine }}" = "all" ] || [ -z "${{ inputs.engine }}" ]; then
            echo 'engines=["successfactors","workday","njoyn","oracle","dayforce","jobs2web","icims","hrsmart","ultipro","adp","taleo","avanti","bamboohr","talentpoolbuilder","custom","rss","jazzhr","workland","jibe"]' >> "$GITHUB_OUTPUT"
          else
            echo 'engines=["${{ inputs.engine }}"]' >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.setup.outputs.engines) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm install

      - name: Install Playwright Browsers
        run: cd scraper && npx playwright install chromium --with-deps

      - name: Run Scraper (${{ matrix.engine }})
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: "deepseek-chat"
          SCRAPE_ENGINE: ${{ matrix.engine }}
        run: cd scraper && npx tsx scraper.ts

  parse:
    needs: scrape
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run_parse) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm install

      - name: Run Parser
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: "deepseek-chat"
        run: cd scraper && npx tsx parser.ts
