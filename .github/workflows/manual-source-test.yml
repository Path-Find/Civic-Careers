name: Manual Source Test

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'One source to test without changing trial pass counts'
        required: true
        type: choice
        options:
          - Niagara College
          - Fleming College
          - Western University
          - University of Alberta
          - York University
          - University of Saskatchewan

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm ci

      - name: Install Playwright Browsers
        run: cd scraper && npx playwright install chromium --with-deps

      - name: Run manual source test
        env:
          NEON_CURRENT_DATABASE_URL: ${{ secrets.NEON_CURRENT_DATABASE_URL }}
          NEON_ARCHIVE_DATABASE_URL: ${{ secrets.NEON_ARCHIVE_DATABASE_URL }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MANUAL_SOURCE: ${{ inputs.source }}
        run: cd scraper && npx tsx manual-source-test.ts
